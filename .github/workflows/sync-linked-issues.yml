name: YDK Sync

# Post-merge bookkeeping: sync task state and linked issues after changes land on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Serialize syncs; never drop one.
concurrency:
  group: ydk-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync tasks and linked issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Sync tasks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: uv run ydk task sync
      - name: Sync linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: uv run ydk task sync-issues
