name: Sync Linked Issues

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync:
    name: Retire completed linked issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync_issue_state.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 skills/gh-issue-to-tasks/scripts/sync_issue_state.py
