name: Sync version from PR tag

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sync-version:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find version tag on HEAD
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | head -n1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set pyproject.toml version to match tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^version = \"[^\"]*\"\$/version = \"$VERSION\"/" pyproject.toml

          if git diff --quiet -- pyproject.toml; then
            echo "pyproject.toml already at $VERSION, nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): set version to $VERSION from tag $TAG"
          git push origin HEAD:"${{ github.head_ref }}"
