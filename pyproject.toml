[project]
name = "ydk"



version = "0.52.1"

description = "YDK — Yoav Development Kit"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "rich>=14",
    "pydantic>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "boto3>=1.35",
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "chromadb>=1.0",
    "anthropic>=0.123.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty>=0.0.1a6",
    "commitizen>=4",
    "playwright>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[project.scripts]
ydk = "ydk.cli:app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
  "ANN001",   # Missing type annotation for function argument
  "ANN002",   # Missing type annotation for *args
  "ANN201",   # Missing return type annotation for public function
  "ANN202",   # Missing return type annotation for private function
  "ANN401",   # Dynamically typed expressions (typing.Any) disallowed
  "B",        # flake8-bugbear
  "UP",       # pyupgrade
  "RUF",      # ruff-specific rules
  "TC",       # flake8-type-checking
  "PT",       # flake8-pytest-style
  "SIM",      # flake8-simplicity
  "PERF",     # perflint
  "FAST",     # FastAPI best practices
  "D101",     # Missing docstring in public class
  "D102",     # Missing docstring in public method
  "D103",     # Missing docstring in public function
  "E",        # pycodestyle errors
  "F",        # pyflakes
  "I",        # isort
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D101",     # Test classes don't need docstrings
  "D102",     # Test methods don't need docstrings
  "D103",     # Test helper functions don't need docstrings
  "ANN001",   # Test function args don't need type annotations
  "ANN201",   # Test functions don't need return type annotations
  "ANN202",   # Test private helpers don't need return type annotations
  "ANN401",   # Tests may use Any for mocking
]
# Catalog generators + catalog tests — relaxed rules for ported code
"src/ydk/catalog/**/generators/**/*.py" = [
  "ANN001", "ANN002", "ANN201", "ANN202", "ANN401",
  "D101", "D102", "D103",
  "B", "UP", "RUF", "SIM", "PERF", "PT",
]
"src/ydk/catalog/**/tests/**/*.py" = [
  "D101", "D102", "D103",
  "ANN001", "ANN201", "ANN202", "ANN401",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end generator tests (slow, requires external sample components)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_conventional_commits"



version = "0.52.1"

tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ydk"]
