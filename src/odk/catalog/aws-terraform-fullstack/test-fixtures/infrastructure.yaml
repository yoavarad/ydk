app:
  name: myapp
  environment: dev
  region: us-east-1
  domain: myapp.example.com

compute:
  cpu: 512
  memory: 1024
  port: 8000
  desired_count: 2
  health_check_path: /health
  autoscaling:
    min_count: 1
    max_count: 4
    cpu_threshold: 70

database:
  engine_version: "15.4"
  min_acu: 0.5
  max_acu: 4
  backup_retention_days: 7
  deletion_protection: false

cdn:
  enabled: true
  price_class: PriceClass_100
  api_path_pattern: "/api/*"
  custom_error_responses:
    - error_code: 403
      response_code: 200
      response_page_path: /index.html
    - error_code: 404
      response_code: 200
      response_page_path: /index.html

auth:
  provider: cognito
  password_policy:
    minimum_length: 8
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_symbols: false
  mfa: optional

networking:
  vpc_cidr: "10.0.0.0/16"
  nat_gateway_mode: single
  availability_zones: 2

monitoring:
  log_retention_days: 30
  alarms:
    cpu_threshold: 80
    memory_threshold: 80
    error_rate_threshold: 5.0
