$schema: ydk:schema:entity
id: ydk:entity:messaging/Message
description: |
  One message received from the other side via the input topic and held in the in-memory
  store for display. Created only by the Kafka consumer after a record passes validation.
  Sent messages are never represented by this entity (ADR-013). Immutable after creation.
fields:
  text:
    type: string
    required: true
    nullable: false
    max_length: 1000
    constraints: "1..1000 Unicode code points; already filtered by the sending instance; never re-filtered on receipt"
    description: "Message body as received in the record value field 'text'"
  time:
    type: datetime
    required: true
    nullable: false
    generated: true
    constraints: "Taken from the Kafka record timestamp, not from the payload (ADR-007); serialized in the API as RFC3339 UTC"
    description: "When the record was produced or appended according to Kafka"
state_transitions: {}
relationships:
  - entity: ydk:entity:messaging/UserMessages
    type: many-to-one
    fk: user
    description: "Each message belongs to exactly one username bucket; the username is the bucket key, not a field on the message"
indexes: []
crud: [create, list-by-user]
