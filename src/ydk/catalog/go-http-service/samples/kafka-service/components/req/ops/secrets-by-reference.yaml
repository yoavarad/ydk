$schema: ydk:schema:req
id: ydk:req:ops/secrets-by-reference
description: "Kafka credentials enter the pod only from Kubernetes Secrets (ADR-008)."
type: policy
priority: critical
rule: |
  The chart takes the name of an existing Secret (kafka.sasl.existingSecret) and the key names
  for username and password, and maps them to KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD via
  secretKeyRef. The CA certificate is mounted read-only from an existing Secret or ConfigMap and
  its path passed as KAFKA_CA_FILE. values.yaml and values.schema.json have no field for a
  password value.
failure_behavior: "values.schema.json rejects unknown keys (additionalProperties false), so a literal password field fails helm lint."
related_components:
  - ydk:crosscut:ops/environment
  - ydk:ext:kafka/cluster
acceptance_criteria:
  - "helm template renders env from secretKeyRef for both SASL variables"
  - "grep of rendered manifests for the local test password finds nothing"
