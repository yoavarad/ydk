$schema: ydk:schema:config
id: ydk:config:ops/app
title: sample-service
version: "Injected at build time via -ldflags from the git tag (vX.Y.Z or X.Y.Z-dev.<shortsha>, ADR-011); logged at startup"
auth:
  provider: none
  note: "No application authentication (ADR-014); see ydk:req:ops/network-restricted-exposure"
cors:
  enabled: false
  note: "Page and API are same origin; no CORS headers are sent; cross-origin browser calls fail by browser default"
middleware:
  - "panic recovery -> ydk:error:api/internal-error"
  - "request logging at DEBUG (method, route pattern, status, duration_ms); health routes excluded"
  - "JSON 404/405 bodies per ydk:crosscut:system/error-format"
