$schema: ydk:schema:crosscut
id: ydk:crosscut:ops/openshift-conventions
description: "Helm chart shape and pod security that run unchanged on OpenShift (SCC restricted-v2) and kind (ADR-009, ADR-014)."
specification: |
  Chart: apiVersion v2, name sample-service, version = appVersion = image tag (ADR-011),
  values.schema.json with additionalProperties false.
  Templates: Deployment, Service (ClusterIP, port 8080), NetworkPolicy, and either Route
  (openshift.enabled=true; edge TLS, insecureEdgeTerminationPolicy Redirect, host route.host)
  or Ingress (openshift.enabled=false; ingress.className, ingress.host). No PVC, HPA, PDB,
  ServiceAccount token mount (automountServiceAccountToken false).
  Deployment: replicas 1, strategy Recreate (ydk:req:ops/single-replica);
  terminationGracePeriodSeconds 15; resources request cpu 50m / memory 64Mi, limit cpu 500m /
  memory 128Mi; env GOMEMLIMIT=100MiB.
  Pod securityContext: runAsNonRoot true, seccompProfile RuntimeDefault, no runAsUser, no
  fsGroup. Container securityContext: allowPrivilegeEscalation false, capabilities drop ALL,
  readOnlyRootFilesystem true. No writable volumes needed. Image USER 1001 (numeric) with
  group 0 permissions so an arbitrary UID works.
  NetworkPolicy: podSelector = app labels; one ingress rule from
  networkPolicy.ingressNamespaceSelector (OpenShift default:
  policy-group.network.openshift.io/ingress=""; kind: kubernetes.io/metadata.name=ingress-nginx)
  on TCP 8080; no egress rules.
applies_to: "Helm chart and Containerfile"
related:
  - ydk:req:ops/network-restricted-exposure
  - ydk:req:ops/single-replica
  - ydk:req:ops/secrets-by-reference
  - ydk:nfr:system/memory
  - ydk:nfr:system/cpu
