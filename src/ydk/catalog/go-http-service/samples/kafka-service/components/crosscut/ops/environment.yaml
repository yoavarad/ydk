$schema: ydk:schema:crosscut
id: ydk:crosscut:ops/environment
description: "Runtime configuration contract: environment variables read once at startup and the Helm values that set them."
specification: |
  All configuration comes from environment variables, read once at startup; no config file,
  no flags. Invalid configuration -> ydk:error:ops/invalid-config (exit 1).

  | Env var | Helm value | Required | Default | Rule |
  |---|---|---|---|---|
  | INSTANCE_NAME | instanceName | yes | - | 1..63 chars [a-z0-9-]; UI label and default consumer group suffix |
  | KAFKA_BOOTSTRAP_SERVERS | kafka.bootstrapServers | yes | - | comma-separated host:port |
  | KAFKA_INPUT_TOPIC | kafka.inputTopic | yes | - | opaque topic name (ADR-001) |
  | KAFKA_OUTPUT_TOPIC | kafka.outputTopic | yes | - | opaque topic name (ADR-001) |
  | KAFKA_CONSUMER_GROUP | kafka.consumerGroup | no | sample-service-<INSTANCE_NAME> | consumer group id; prod supplies its own (ADR-017) |
  | KAFKA_SECURITY_PROTOCOL | kafka.securityProtocol | no | SASL_SSL | PLAINTEXT or SASL_SSL only |
  | KAFKA_SASL_USERNAME | kafka.sasl.existingSecret + usernameKey | if SASL_SSL | - | secretKeyRef only |
  | KAFKA_SASL_PASSWORD | kafka.sasl.existingSecret + passwordKey | if SASL_SSL | - | secretKeyRef only; never logged |
  | KAFKA_CA_FILE | kafka.ca.existingSecret or kafka.ca.configMap + key | no | system roots | PEM file path; chart mounts at /etc/sample-service/ca/ca.crt |
  | FILTER_CHARS | filter.chars | no | $!~ (PENDING real list) | each code point is one denied character; empty = none |
  | LOG_LEVEL | logLevel | no | INFO | DEBUG, INFO, WARN, ERROR |
  | GOMEMLIMIT | (fixed in chart) | no | 100MiB | Go runtime soft limit below the 128Mi container limit (ADR-017) |

  HTTP listen port is fixed at 8080 (not configurable, ADR-017). Consumer group id is
  KAFKA_CONSUMER_GROUP, default sample-service-<INSTANCE_NAME>; a new group starts at the latest
  offset (ADR-017). Startup logs every setting except KAFKA_SASL_PASSWORD.
applies_to: "cmd/sample-service (main) and internal/config; Helm chart templates/deployment.yaml and values.schema.json"
implementation_notes:
  - "internal/config returns a typed Config and an error naming the first invalid variable"
  - "Distinguish unset FILTER_CHARS (use default) from set-but-empty (no filtering) with os.LookupEnv"
  - "values.schema.json mirrors the table with additionalProperties false"
related:
  - ydk:error:ops/invalid-config
  - ydk:req:ops/secrets-by-reference
  - ydk:req:messaging/filter-blocklist
  - ydk:config:ops/app
