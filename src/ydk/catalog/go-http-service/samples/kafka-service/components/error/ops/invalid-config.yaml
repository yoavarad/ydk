$schema: ydk:schema:error
id: ydk:error:ops/invalid-config
description: |
  Startup error, not an HTTP response (status_code 0 = no HTTP status). Configuration from
  environment variables is invalid. The process logs one ERROR line naming the variable (never
  its value for KAFKA_SASL_PASSWORD) and exits with code 1 before opening port 8080.
  Kubernetes shows CrashLoopBackOff.
status_code: 0
code: INVALID_CONFIG
detail_template: "invalid config: ${variable}: ${reason}"
response_shape:
  level:
    type: string
    description: "ERROR"
  msg:
    type: string
    description: "invalid config"
  variable:
    type: string
    description: "Name of the offending environment variable"
  reason:
    type: string
    description: "missing | invalid value | file unreadable"
triggers:
  - "INSTANCE_NAME, KAFKA_BOOTSTRAP_SERVERS, KAFKA_INPUT_TOPIC or KAFKA_OUTPUT_TOPIC unset or empty"
  - "KAFKA_SECURITY_PROTOCOL not PLAINTEXT or SASL_SSL (ADR-008)"
  - "KAFKA_SECURITY_PROTOCOL=SASL_SSL and KAFKA_SASL_USERNAME or KAFKA_SASL_PASSWORD empty"
  - "KAFKA_CA_FILE set but unreadable or not PEM"
  - "LOG_LEVEL not DEBUG, INFO, WARN or ERROR"
related:
  - ydk:crosscut:ops/environment
