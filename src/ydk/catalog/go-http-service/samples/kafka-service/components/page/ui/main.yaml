$schema: ydk:schema:page
id: ydk:page:ui/main
description: |
  The only page. Left half: send a message under a username. Right half: messages received
  from the other side for the username currently in the username field, newest first.
  Served by ydk:route:api/index; vanilla JS/CSS inline in index.html; no external resources.
route: /
auth: none
layout: "Two columns, 50/50 width, full viewport height; stacks vertically below 700 px viewport width"
sections:
  - name: header
    description: "Title 'sample-service' and instance label '[<INSTANCE_NAME>]' inserted server-side"
  - name: send
    description: "Username input, textarea, counter, Send button, status line"
    data_sources:
      - ydk:route:api/send-message
    component: ydk:component:ui/send-form
  - name: received
    description: "Heading 'Received from other side' and the list of received messages with copy buttons"
    data_sources:
      - ydk:route:api/get-messages
    component: ydk:component:ui/received-list
wireframe: |
  ┌──────────────────────────────────────┬──────────────────────────────────────┐
  │ sample-service                 [side A] │ Received from other side             │
  │ User: [alice__________________]        │ 14:02:31                    [copy]   │
  │ ┌──────────────────────────────────┐ │ ┌──────────────────────────────────┐ │
  │ │  free text...                    │ │ │ kubectl get pods -n foo          │ │
  │ └──────────────────────────────────┘ │ └──────────────────────────────────┘ │
  │ 0/1000                      [Send]   │ ...  (newest first, max 100)         │
  │ status: sent / error: text > 1000    │                                      │
  └──────────────────────────────────────┴──────────────────────────────────────┘
