$schema: ydk:schema:req
id: ydk:req:messaging/user-length
description: "Username length limit, enforced on send, on GET and on receive (ADR-006)."
type: validation
priority: critical
rule: |
  A username is 1..128 Unicode code points (utf8.RuneCountInString), counted before censoring,
  without trimming. Outgoing violation: 400 and nothing published. GET violation: 400.
  Incoming record violation: record dropped. The browser maxlength=128 is a convenience only.
failure_behavior: "Send/GET: ydk:error:api/validation-failed; Receive: ydk:error:messaging/bad-incoming-record"
related_components:
  - ydk:route:api/send-message
  - ydk:route:api/get-messages
  - ydk:entity:messaging/UserMessages
acceptance_criteria:
  - "128 code points accepted; 129 rejected with 400 'user must be 1..128 characters'"
  - "Empty or missing user rejected with 400"
  - "128 emoji (4 bytes, 2 UTF-16 units each) accepted"
  - "Incoming record with 129-code-point user is dropped and logged with reason user_length"
