$schema: ydk:schema:req
id: ydk:req:messaging/sent-not-stored
description: "Messages typed on an instance are published only, never kept locally (ADR-013)."
type: business-rule
priority: medium
rule: "The send path does not call the store. The received list on an instance shows only records from its input topic."
failure_behavior: "No error path."
related_components:
  - ydk:route:api/send-message
  - ydk:entity:messaging/MessageStore
acceptance_criteria:
  - "After a successful send as bob on A, GET bob on A returns [] (unless B sent to bob)"
