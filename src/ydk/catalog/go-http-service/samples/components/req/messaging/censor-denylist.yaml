$schema: ydk:schema:req
id: ydk:req:messaging/censor-denylist
description: "Replace denied characters with '_' in username and text before publishing (ADR-005)."
type: business-rule
priority: critical
rule: |
  The denylist is the set of Unicode code points in CENSOR_CHARS (unset -> default "$!~";
  set to empty -> no code point denied). Before publishing, every code point of user and text
  that is in the denylist is replaced by '_' (U+005F); every other code point is unchanged.
  Replacement is 1:1, so code-point length is unchanged and limits checked before censoring
  still hold. The same function is applied to the GET user query parameter before lookup.
  Received records are not re-censored. PENDING: the real denylist is delivered externally
  and replaces the default through the Helm value censor.chars only.
failure_behavior: "No error path. A denied character that reaches Kafka uncensored is a defect caught by ydk:test:messaging/censor.unit and ydk:test:system/round-trip.e2e"
related_components:
  - ydk:contract:messaging/Censor
  - ydk:route:api/send-message
  - ydk:route:api/get-messages
  - ydk:crosscut:ops/environment
acceptance_criteria:
  - "With default list, text 'a$b!c~d' is published as 'a_b_c_d'"
  - "With default list, user 'bob$' is published with key and user 'bob_'"
  - "Multi-byte code points in CENSOR_CHARS (e.g. '€') are replaced as one character"
  - "Characters not in the list (including '_', quotes, '<', newline) pass through unchanged"
  - "CENSOR_CHARS='' publishes input unchanged"
  - "GET with user 'bob$' returns messages stored under 'bob_'"
