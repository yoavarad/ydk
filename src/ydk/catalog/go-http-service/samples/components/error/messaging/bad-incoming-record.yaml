$schema: ydk:schema:error
id: ydk:error:messaging/bad-incoming-record
description: |
  Consumer-side error, not an HTTP response (status_code 0 = no HTTP status). A record from the
  input topic fails decoding or validation. It is dropped, logged at WARN, its offset is
  committed, and consumption continues (ADR-006). Nothing reaches the store or the UI.
status_code: 0
code: BAD_INCOMING_RECORD
detail_template: "dropped invalid record: ${reason}"
response_shape:
  level:
    type: string
    description: "WARN"
  msg:
    type: string
    description: "dropped invalid record"
  reason:
    type: string
    description: "invalid_json | missing_user | missing_text | user_length | text_length"
  topic:
    type: string
    description: "Input topic"
  partition:
    type: integer
    description: "Record partition"
  offset:
    type: integer
    description: "Record offset"
triggers:
  - "Value is not valid JSON or not an object -> invalid_json"
  - "user missing or not a string -> missing_user"
  - "text missing or not a string -> missing_text"
  - "user empty or over 128 code points -> user_length"
  - "text empty or over 1000 code points -> text_length"
related:
  - ydk:req:messaging/drop-invalid-incoming
  - ydk:entity:messaging/KafkaRecord
