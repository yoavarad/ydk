$schema: ydk:schema:crosscut
id: ydk:crosscut:ops/local-environment
description: "Local and CI environment emulating prod: kind + Strimzi + two releases (ADR-009)."
specification: |
  - Docker Engine in WSL2 Ubuntu; kind v0.33.0 cluster 'clopy-paste' with extraPortMappings
    host 8080 -> node 80 for ingress-nginx; helm v4.3.0; kubectl.
  - ingress-nginx in namespace ingress-nginx. Strimzi 1.2.0 operator; Kafka cluster 'kafka' in
    namespace clopy-paste, KRaft single node, listeners: plain (9092, no auth) and tls
    (9093, TLS + SCRAM-SHA-512). Authorization not enabled locally.
  - KafkaTopic CRs a.out and b.out (3 partitions, replicas 1). KafkaUser clopy-paste-a
    (scram-sha-512); its Secret supplies the SASL credentials; Secret kafka-cluster-ca-cert
    supplies the CA.
  - Release clopy-paste-a: instanceName side-a, output a.out, input b.out, SASL_SSL on 9093,
    ingress host a.clopy-paste.local.
  - Release clopy-paste-b: instanceName side-b, output b.out, input a.out, PLAINTEXT on 9092,
    ingress host b.clopy-paste.local.
  - A.output = B.input and B.output = A.input stand in for the external pipeline; no forwarder.
  - e2e and smoke reach each release at http://localhost:8080 with Host header a.clopy-paste.local
    or b.clopy-paste.local (no DNS needed).
  - Image loaded with kind load docker-image; no registry needed locally.
  - Scripts: scripts/env-up.sh, scripts/env-down.sh, invoked by make env-up / make env-down.
applies_to: "scripts/, Makefile, e2e and smoke stages"
related:
  - ydk:ext:kafka/external-pipeline
  - ydk:ext:kafka/cluster
