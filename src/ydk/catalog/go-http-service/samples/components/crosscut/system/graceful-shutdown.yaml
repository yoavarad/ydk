$schema: ydk:schema:crosscut
id: ydk:crosscut:system/graceful-shutdown
description: "Ordered shutdown on SIGTERM/SIGINT within 10 s."
specification: |
  On SIGTERM or SIGINT, with one 10 s overall deadline:
  1. Mark not ready (readiness returns 503 'shutting down').
  2. http.Server.Shutdown: stop accepting connections, wait for in-flight requests (including
     pending publishes, each bounded by its 5 s deadline).
  3. Flush the producer (wait for outstanding acks).
  4. Stop consuming; commit marked offsets; leave the consumer group.
  5. Close the Kafka client; log "shutdown complete"; exit 0.
  If the deadline expires, log WARN with the step reached and exit 1.
  Chart: terminationGracePeriodSeconds 15.
applies_to: "cmd/clopy-paste (main), HTTP server, Kafka adapter"
implementation_notes:
  - "signal.NotifyContext(ctx, SIGTERM, SIGINT) in main"
related:
  - ydk:nfr:system/shutdown-time
  - ydk:route:api/readyz
