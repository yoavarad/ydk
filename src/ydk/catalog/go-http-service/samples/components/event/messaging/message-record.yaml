$schema: ydk:schema:event
id: ydk:event:messaging/message-record
description: |
  Kafka record contract between two instances (ADR-007). Emitted once per accepted send on the
  instance's output topic as a KafkaRecord (ydk:entity:messaging/KafkaRecord). The external
  pipeline moves it to the peer instance's input topic, where it becomes a
  ydk:entity:messaging/Message in the peer store.
payload:
  key:
    type: bytes
    description: "UTF-8 censored username"
  user:
    type: string
    description: "JSON value field; censored username, 1..128 code points"
  text:
    type: string
    description: "JSON value field; censored text, 1..1000 code points"
producers:
  - ydk:route:api/send-message
  - ydk:contract:messaging/Publisher
consumers:
  - ydk:ext:kafka/external-pipeline
  - "Peer instance Kafka consumer: validates per ydk:req:messaging/drop-invalid-incoming and calls ydk:contract:messaging/Store Add"
ordering: "Per-user. Key = username, so records for one username land in one partition in produce order, provided the external pipeline preserves keys."
idempotency: "Producer idempotence enabled (no duplicates from producer retries). Consumer is at-least-once: offsets are committed after the record is stored or dropped, so a crash between store insert and commit re-delivers the record and the message is displayed twice. No dedup key; accepted."
