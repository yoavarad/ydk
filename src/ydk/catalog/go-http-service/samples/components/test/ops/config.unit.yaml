$schema: ydk:schema:test
id: ydk:test:ops/config.unit
description: "Environment parsing and validation (ydk:crosscut:ops/environment)."
level: unit
target: ydk:error:ops/invalid-config
cases:
  - name: minimal-plaintext
    description: "Required vars only"
    given: "INSTANCE_NAME, KAFKA_BOOTSTRAP_SERVERS, KAFKA_INPUT_TOPIC, KAFKA_OUTPUT_TOPIC set; KAFKA_SECURITY_PROTOCOL=PLAINTEXT"
    when: "Load"
    then: "OK; CENSOR_CHARS '$!~'; LOG_LEVEL INFO"
  - name: missing-required
    description: "Each required var missing"
    given: "One required var unset"
    when: "Load"
    then: "Error naming that variable"
  - name: bad-protocol
    description: "ADR-008 two modes only"
    given: "KAFKA_SECURITY_PROTOCOL=SSL"
    when: "Load"
    then: "Error naming KAFKA_SECURITY_PROTOCOL"
  - name: sasl-needs-creds
    description: "Credentials required for SASL_SSL"
    given: "Protocol default (SASL_SSL), no username"
    when: "Load"
    then: "Error naming KAFKA_SASL_USERNAME; error text does not contain the password value"
  - name: empty-censor
    description: "Set-but-empty disables censoring"
    given: "CENSOR_CHARS=''"
    when: "Load"
    then: "Denylist empty"
stubs:
  - "Environment via t.Setenv"
never_mock:
  - "config package"
