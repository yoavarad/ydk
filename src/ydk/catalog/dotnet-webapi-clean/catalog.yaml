name: dotnet-webapi-clean
version: 1.0.0
tags: [ignition-pack, dotnet, aspnetcore, clean-architecture, efcore, xunit]

inputs:
  entity:
    schema_ref: ydk-core-schemas/entity
    version: ">=1.0.0"
    required: true
  route:
    schema_ref: ydk-core-schemas/route
    version: ">=1.0.0"
    required: true
  contract:
    schema_ref: ydk-core-schemas/contract
    version: ">=1.0.0"
    required: true
  error:
    schema_ref: ydk-core-schemas/error
    version: ">=1.0.0"
    required: false

verification_sets:
  - name: dotnet-quality
    version: ">=1.0.0"
  - name: dotnet-tdd-guard
    version: ">=1.0.0"

spec_reviewers:
  - name: ydk-default-reviewers
    version: ">=1.0.0"

component_schemas:
  - name: ydk-core-schemas
    version: ">=1.0.0"
