name: crosscut
description: "A cross-cutting concern that applies uniformly across the system"
version: 2
fields:
  id:
    type: string
    required: true
    pattern: "^ydk:crosscut:.+"
    description: "Unique component identifier in ydk:crosscut:name format"
  description:
    type: text
    required: true
    description: "What this cross-cutting concern defines"
  kind:
    type: string
    description: "What kind of concern this is, for generators to select it by (e.g. error-format)"
  specification:
    type: text
    required: true
    description: "The exact specification of this concern (format, rules, behavior)"
  applies_to:
    type: string
    required: true
    description: "Which parts of the system this applies to"
  implementation_notes:
    type: list
    description: "Guidance for implementing this concern"
  related:
    type: ref_list
    description: "Related components (hooks, routes, errors)"
